[project]
name = "summon-the-titans"
version = "0.1.0"
description = "Two-stage distillation experiments from Rawat et al. (2021)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "timm>=1.0.28",
  "torch>=2.6",
  "torchvision>=0.21",
]

[project.scripts]
titans = "titans.experiment:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/titans"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
